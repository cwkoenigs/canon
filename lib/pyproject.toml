[project]
name = "canon-lib"
version = "0.1.0"
description = "The team's accepted, tested code, from the canon."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
tui = ["rich>=13", "prompt-toolkit>=3.0.40"]

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canon_lib"]

[tool.ruff]
line-length = 120
