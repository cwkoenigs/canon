[project]
name = "{{name}}"
version = "0.1.0"
description = {{purpose_json}}
requires-python = ">=3.12"
dependencies = ["typer>=0.12", {{canon_lib_dep}}]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
{{name}} = "{{package}}.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{package}}"]
{{canon_lib_source}}